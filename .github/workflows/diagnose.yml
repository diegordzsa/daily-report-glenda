name: TEMP Dry Run

# WORKFLOW TEMPORAL DE VERIFICACION. Ejecuta report.js con los secrets reales
# pero con SLACK_WEBHOOK_URL apuntando a un sumidero local: nada llega al canal.
# Borrar cuando termine la verificacion.

on:
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Escribir sumidero de Slack
        run: |
          cat > /tmp/sink.mjs <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          http.createServer((req, res) => {
            let body = '';
            req.on('data', c => body += c);
            req.on('end', () => {
              fs.appendFileSync('/tmp/slack-capturado.txt',
                '\n--- PAYLOAD CAPTURADO ---\n' + body + '\n');
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end('ok');
            });
          }).listen(8099, '127.0.0.1', () => console.log('sumidero escuchando en 8099'));
          EOF
          node /tmp/sink.mjs &
          sleep 2
          echo "sumidero arrancado"

      - name: Caso 1 - dia sin cerrar, el guard DEBE bloquear
        continue-on-error: true
        env:
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: 'http://127.0.0.1:8099/sink'
          META_ACCOUNT_TIMEZONE: 'America/Mexico_City'
          MIN_HOURS_AFTER_CLOSE: '3'
          STORE_CURRENCY_ISO: 'MXN'
          META_CURRENCY_ISO: 'EUR'
          REPORT_CURRENCY_ISO: 'EUR'
          STORE_LOCALE: 'es-ES'
          REPORT_TIME_LABEL: '11:05 (Europe/Madrid)'
        run: |
          HOY=$(TZ=America/Mexico_City date +%F)
          echo "REPORT_DATE=$HOY (hoy en Mexico, todavia sin cerrar)"
          REPORT_DATE=$HOY node src/report.js
          echo "EXIT=$?"

      - name: Caso 2 - dia cerrado hace horas, DEBE generar el reporte completo
        env:
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: 'http://127.0.0.1:8099/sink'
          META_ACCOUNT_TIMEZONE: 'America/Mexico_City'
          MIN_HOURS_AFTER_CLOSE: '3'
          STORE_CURRENCY_ISO: 'MXN'
          META_CURRENCY_ISO: 'EUR'
          REPORT_CURRENCY_ISO: 'EUR'
          STORE_LOCALE: 'es-ES'
          REPORT_TIME_LABEL: '11:05 (Europe/Madrid)'
        run: |
          AYER=$(TZ=America/Mexico_City date -d 'yesterday' +%F)
          echo "REPORT_DATE=$AYER (ayer en Mexico, ya cerrado)"
          REPORT_DATE=$AYER node src/report.js

      - name: Mostrar lo que se habria enviado a Slack
        if: always()
        run: |
          echo "=================================================="
          cat /tmp/slack-capturado.txt || echo "(nada capturado)"
          echo "=================================================="
