name: Meta Freshness Probe

# Solo lee y loguea. NUNCA escribe en Slack.
#
# Dos usos:
#
# 1. Validar la autenticacion de un cronjob nuevo en cron-job.org sin mandar un
#    reporte duplicado al canal. Usa el mismo token y las mismas cabeceras que el
#    reporte, asi que un 204 aqui significa que el del reporte tambien funcionara.
#
# 2. Bajar la hora de entrega con datos en vez de por corazonada. Dispararlo 1 h
#    y 2 h antes de la hora actual durante ~5 dias y comparar cada muestra contra
#    el consolidado. Si el error se mantiene entre -0.4 % y -1.0 % (lo medido
#    entre 2.9 h y 4.5 h post-cierre), se puede bajar la hora y
#    MIN_HOURS_AFTER_CLOSE. Si se dispara, se queda como esta.
#
# Cada ejecucion imprime una linea PROBE con las horas post-cierre y el gasto que
# Meta reportaba en ese instante. El consolidado se lee dias despues, con la
# seccion CONSOLIDADO de la propia salida.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCOUNT_TIMEZONE: 'America/Mexico_City'
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { hoursSinceDayClose, yesterdayInZone } from './src/freshness.js';

          const TOKEN = process.env.META_ACCESS_TOKEN;
          const ACT = process.env.META_AD_ACCOUNT_ID;
          const V = 'v21.0';

          // La timezone se lee de la cuenta, igual que hace el reporte.
          let tz = process.env.META_ACCOUNT_TIMEZONE;
          try {
            const r = await fetch(`https://graph.facebook.com/${V}/act_${ACT}?fields=timezone_name&access_token=${TOKEN}`);
            const j = await r.json();
            if (j.timezone_name) tz = j.timezone_name;
          } catch { /* nos quedamos con el fallback */ }

          const now = new Date();
          const date = yesterdayInZone(tz, now);
          const hours = hoursSinceDayClose(date, tz, now);

          const p = new URLSearchParams({
            access_token: TOKEN,
            time_range: JSON.stringify({ since: date, until: date }),
            level: 'account',
            fields: 'spend,impressions,clicks,account_currency',
          });
          const res = await fetch(`https://graph.facebook.com/${V}/act_${ACT}/insights?${p}`);
          const json = await res.json();
          const row = (json.data || [])[0] || {};

          console.log(
            `PROBE now=${now.toISOString()} tz=${tz} date=${date} ` +
            `hours_post_close=${hours.toFixed(3)} spend=${row.spend ?? 'n/a'} ` +
            `currency=${row.account_currency ?? 'n/a'} impressions=${row.impressions ?? 'n/a'}`
          );

          // Consolidado de los dias anteriores, para cruzar contra muestras viejas.
          const until = new Date(now.getTime() - 2 * 86400000).toISOString().slice(0, 10);
          const since = new Date(now.getTime() - 9 * 86400000).toISOString().slice(0, 10);
          const p2 = new URLSearchParams({
            access_token: TOKEN,
            time_range: JSON.stringify({ since, until }),
            time_increment: '1',
            level: 'account',
            fields: 'spend',
          });
          const res2 = await fetch(`https://graph.facebook.com/${V}/act_${ACT}/insights?${p2}`);
          const json2 = await res2.json();
          for (const r of (json2.data || [])) {
            console.log(`CONSOLIDADO ${r.date_start} spend=${r.spend}`);
          }
          EOF
          cp /tmp/probe.mjs ./probe.mjs
          node ./probe.mjs
