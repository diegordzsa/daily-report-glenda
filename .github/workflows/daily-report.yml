name: Daily Report

on:
  schedule:
    # Hora UTC. NO bajar de 06:00 UTC: la tienda Shopify esta en Mexico (UTC-6),
    # asi que el dia que se reporta (ayer) recien cierra a las 06:00 UTC. Correr
    # antes devuelve datos incompletos (se pierden las ventas de la noche).
    # 06:15 UTC = 00:15 Mexico (dia cerrado, +15 min de margen)
    #           =  8:15 Madrid en verano / 7:15 en invierno.
    #
    # OJO: GitHub encola los workflows programados y los arranca con 2-3.5 h de
    # retraso real, asi que la entrega efectiva ronda las 10:00-11:45 Madrid.
    # Ver notas en SETUP.md para conseguir una hora exacta.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Date to report on (YYYY-MM-DD). Leave empty for yesterday.'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run daily report
        env:
          # --- Requeridas (configurar en Settings > Secrets) ---
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # --- Opcionales ---
          STORE_CURRENCY: '$'
          STORE_LOCALE: 'es-MX'
          META_CURRENCY: '€'
          REPORT_CURRENCY: '€'
          # STORE_INDUSTRY: ''
          # ROAS_BENCHMARK: ''
          # SUBSCRIPTION_TAGS: '[]'
          REPORT_DATE: ${{ inputs.report_date }}
        run: node src/report.js
