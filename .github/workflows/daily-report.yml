name: Daily Report

# NO hay bloque `schedule:` a proposito.
#
# El scheduler de GitHub encola los cron y los arranca tarde, sin patron. Medido
# sobre 21 ejecuciones reales de este repo (9-29 jul 2026, contra el cron vigente
# en cada fecha): entre +1 h 55 min y +3 h 36 min, media +2 h 41 min. Con esa
# dispersion no se puede prometer una hora de entrega ni garantizar que el dia
# haya cerrado.
#
# El disparo lo hace un cronjob externo (cron-job.org) contra la API de
# dispatches, configurado en Europe/Madrid. Ver SETUP.md.
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Date to report on (YYYY-MM-DD). Leave empty for yesterday.'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run daily report
        env:
          # --- Requeridas (configurar en Settings > Secrets) ---
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # --- Frescura de datos ---
          # Medido 2026-07-29 en GET /act_<id>?fields=timezone_name:
          #   cuenta "SKIN+ MX" -> America/Mexico_City, offset -6, sin DST.
          # Solo es el fallback: el codigo lee la timezone de la API en cada run.
          META_ACCOUNT_TIMEZONE: 'America/Mexico_City'
          # El dia cierra a las 06:00 UTC. 3 h => no publicar antes de 09:00 UTC.
          # Medido: entre 2.92 h y 4.54 h post-cierre el error fue -0.41 % a
          # -0.98 %, siempre subestimando. Por debajo de 2.9 h no hay datos.
          MIN_HOURS_AFTER_CLOSE: '3'

          # --- Moneda (medida 2026-07-29, no copiada de otra tienda) ---
          # Shopify GLENDA(R): currency=MXN, money_format="$ {{amount}}"
          # Cuenta Meta "SKIN+ MX": currency=EUR
          # El lector esta en Madrid, asi que el reporte se muestra en EUR.
          STORE_CURRENCY_ISO: 'MXN'
          META_CURRENCY_ISO: 'EUR'
          REPORT_CURRENCY_ISO: 'EUR'
          # El simbolo sale del ISO + STORE_LOCALE (EUR + es-ES => "€").
          # Descomentar solo para forzar otro simbolo.
          # REPORT_CURRENCY: '€'

          # Locale del LECTOR (Madrid), no el de la tienda: los importes salen en
          # euros y se leen en Espana -> 1.234,56 en vez de 1,234.56.
          STORE_LOCALE: 'es-ES'

          # Debe coincidir con la hora configurada en cron-job.org.
          REPORT_TIME_LABEL: '11:05 (Europe/Madrid)'

          # STORE_INDUSTRY: ''
          # ROAS_BENCHMARK: ''
          # SUBSCRIPTION_TAGS: '[]'
          # FX_FALLBACK_STORE_PER_REPORT: ''  # MXN por 1 EUR, solo si falla la API de FX
          REPORT_DATE: ${{ inputs.report_date }}
        run: node src/report.js
